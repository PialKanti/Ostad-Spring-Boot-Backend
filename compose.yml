services:
  postgres-db:
    container_name: ecommerce_backend_db
    image: postgres:18.0-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin@123
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_data:/var/lib/ostad/ecommerce/data
    networks:
      - backend_net
  
  inventory-db:
    container_name: inventory_service_db
    image: postgres:18.0-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: inventory_admin
      POSTGRES_PASSWORD: inventory@123
      POSTGRES_DB: inventory_db
    volumes:
      - inventory_data:/var/lib/postgresql/data
    networks:
      - backend_net

  redis:
    container_name: ecommerce_backend_redis
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      REDIS_PASSWORD: admin@123
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  inventory_data:
