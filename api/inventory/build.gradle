plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Inventory service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- Spring Boot Starters ---
	implementation 'org.springframework.boot:spring-boot-starter-web' // REST API
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA + Hibernate
	implementation 'org.springframework.boot:spring-boot-starter-validation' // Bean validation

	// --- Database & Migration ---
	runtimeOnly 'org.postgresql:postgresql' // PostgreSQL driver
	implementation 'org.flywaydb:flyway-core' // Flyway migration
	implementation 'org.flywaydb:flyway-database-postgresql' // PostgreSQL support

	// --- Code Generation & Mapping ---
	compileOnly 'org.projectlombok:lombok' // Lombok (compile-time only)
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.mapstruct:mapstruct:1.6.3' // DTO/entity mapping
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// --- API Documentation ---
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14' // Swagger/OpenAPI UI

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
